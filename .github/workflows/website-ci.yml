name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/website-release-and-live-data-safety

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Production build
        run: bun run build
